# Data source registry — fill in the blanks (download_date, versions) as you
# actually run Phase 1. This file is a reproducibility record, not code.

discovery:
  name: FieldEffectCrc_CohortA
  bioconductor_package: FieldEffectCrc
  bioconductor_version: "3.24"   # verify against your installed version
  accessor_function: cohort_A()
  n_samples: 834
  composition: {CRC: 311, HLT: 462, NAT: 61}
  genome_build: GRCh38
  gene_id_scheme: Ensembl
  download_date: null            # fill in

validation_1:
  name: FieldEffectCrc_CohortB
  accessor_function: cohort_B()
  n_samples: 30
  composition: matched_tumor_normal_pairs
  role: same_protocol_external_validation
  download_date: null

validation_2:
  name: FieldEffectCrc_CohortC
  accessor_function: cohort_C()
  n_samples: 275
  sequencing_format: single-end   # confound vs A/B (paired-end)
  role: cross_protocol_stress_test
  download_date: null

validation_3:
  name: TCGA-COAD
  source: GDC
  data_type: Gene Expression Quantification
  workflow: STAR - Counts
  sample_types: [Primary Tumor, Solid Tissue Normal]
  expected_n: {tumor: 444, normal: 41}   # verify against actual query result
  normal_tissue_definition: adjacent_normal  # NOT equivalent to Cohort A's "HLT"
  role: cross_tissue_state_test
  download_date: null

validation_4:
  name: GEO_EOCRC_LOCRC_pooled
  accessions: [GSE196006, GSE251845]
  cohort_arms: {GSE196006: EOCRC, GSE251845: LOCRC}
  expected_n_patients: 43
  matched_pairs: true
  lab: Penn State Genome Sciences core
  platform: Illumina NovaSeq 6000, paired-end 100bp
  alignment: STAR, hg38
  role: independent_lab_matched_pairs_validation
  download_date: null

notes:
  - "TCGA-COAD 'normal' = adjacent-normal; distinct from Cohort A's HLT (healthy). Treated as a cross-tissue-state generalization test, not a like-for-like replication."
  - "Cohort C is a deliberate cross-protocol stress test; a performance drop there is pre-specified as informative, not a pipeline failure."
  - "GSE196006 + GSE251845 are two GEO accessions from ONE underlying study; pooled and documented as a single external validation cohort."
